# Runs the offline test suites on every push and pull request. Both suites
# stub Ollama, ComfyUI and LiteGraph, so no services are needed here.
name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor in pyproject.toml; 3.12 matches current ComfyUI.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest -r requirements.txt
      - run: python -m pytest

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Files listed explicitly: a quoted glob is not expanded by every shell
      # and silently runs nothing. js_syntax parses every file in js/, which
      # is what catches a module that would stop the node UI from loading.
      - run: node --test tests/canvas_writer.test.mjs tests/health_summary.test.mjs tests/js_syntax.test.mjs
