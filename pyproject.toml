[project]
name = "comfy_agent"
version = "0.0.1"
description = "Meta-node: builds ComfyUI workflows from natural language on the canvas, and answers questions about your install."
license = { text = "MIT" }
requires-python = ">=3.10"
# aiohttp is imported by llm_client.py, agent_routes.py, install_index.py and
# knowledge/schema_compactor.py. ComfyUI already ships it, but an undeclared
# import disappears on a clean install.
#
# Nothing else is needed: the CHAT install index deliberately uses stdlib-only
# math for cosine similarity rather than pulling in numpy. At 1767 nodes the
# pure-Python scan is fast enough, and a native dependency is a poor trade for
# a custom node that must install cleanly inside someone else's ComfyUI.
dependencies = ["aiohttp>=3.9"]

[project.urls]
# The Registry reads the repository URL from here. Update if you fork or move
# the project — a wrong URL publishes fine and then sends users nowhere.
Repository = "https://github.com/suryateja963/comfy-agent"

[tool.comfy]
# PublisherId must be set to your ComfyUI Registry publisher handle before
# `comfy node publish` will succeed — it is the one field the Registry
# rejects when empty. Deliberately left blank: it is an account handle, not
# something that can be guessed correctly. Icon is optional (a URL to a
# square PNG/SVG).
PublisherId = ""
DisplayName = "Comfy Agent"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites build their package tree by hand, because ComfyUI's comfy_api and
# server are not importable outside a running install. The repo root holds the
# node's __init__.py, though, so pytest would collect it as a package and
# import it first — which fails without ComfyUI, and fails outright in a
# `comfy-agent` checkout (not a valid package name). The plugin below makes
# pytest treat the root as a plain directory. It must be a plugin rather than
# a conftest.py: a conftest beside __init__.py is imported as part of the
# package and hits the same failure.
pythonpath = ["tests"]
addopts = "-q -p _collect_root_as_dir"
